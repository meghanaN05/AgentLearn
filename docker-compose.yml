services:
  postgres:
    image: postgres:16-alpine
    container_name: agentlearn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentlearn
      POSTGRES_PASSWORD: agentlearn
      POSTGRES_DB: agentlearn
    # Host port 5433 avoids clashing with a local Postgres install on 5432.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentlearn -d agentlearn"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
